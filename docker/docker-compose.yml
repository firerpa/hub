version: "3"

networks:
    pigeon-net:
        driver: bridge
        ipam:
            config:
                - subnet: 172.35.0.0/24
    lan-ipvlan:
        driver: ipvlan
        driver_opts:
            parent: ${LOCAL_LAN_INTERFACE}
        ipam:
            config:
                - subnet: ${LOCAL_LAN_SUBNET}
                  gateway: ${LOCAL_LAN_GATEWAY}

services:
    pigeon:
        image: firerpa/pigeon:1.0
        container_name: pigeon
        depends_on:
            - postgres
            - rabbitmq
            - redis-master
            - redis-slave01
            - redis-slave02
            - redis-lock01
            - redis-lock02
            - redis-lock03
        environment:
            - DOMAIN=${DOMAIN}
            - API_PORT=${API_PORT}
            - WEB_PORT=${WEB_PORT}
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - LOCAL_LAN_IP=${LOCAL_LAN_IP}
            - PUBLIC_IP=${PUBLIC_IP}
            - TOP_CLIENT_KEY=${TOP_CLIENT_KEY}
            - TOP_ENDPOINT=${TOP_ENDPOINT}
            - TOP_SECRET=${TOP_SECRET}
        privileged: true
        cap_add:
            - NET_ADMIN
        ports:
            - ${API_PORT}:${API_PORT}
            - ${WEB_PORT}:${WEB_PORT}
            - ${FWD_PORT}:${FWD_PORT}
            - 8883:8883
        networks:
            pigeon-net: {}
            lan-ipvlan:
                ipv4_address: ${LOCAL_LAN_IP}
        volumes:
            - ./data/user:/user

    postgres:
        image: postgres:18
        container_name: postgres
        shm_size: 256MB
        networks:
            - pigeon-net
        environment:
            - PGDATA=/var/lib/postgresql/data
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_USER=postgres
            - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
            - POSTGRES_DB=pigeon
        volumes:
            - ./postgres.conf:/etc/postgresql/postgresql.conf
            - ./data/postgres:/var/lib/postgresql/data
        command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres"]
            interval: 10s
            timeout: 5s

    rabbitmq:
        image: rabbitmq:3
        container_name: rabbitmq
        networks:
            - pigeon-net
        environment:
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
            - RABBITMQ_DEFAULT_USER=rabbit
        volumes:
            -  ./data/rabbitmq:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
            interval: 10s
            timeout: 5s

    redis-master:
        image: redis:8
        container_name: redis-master
        command: sh /usr/bin/redis-server.sh
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        networks:
            - pigeon-net
        volumes:
            - ./redis/server-master.sh:/usr/bin/redis-server.sh
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s

    redis-slave01:
        image: redis:8
        container_name: redis-slave01
        command: sh /usr/bin/redis-server.sh
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        networks:
            - pigeon-net
        volumes:
            - ./redis/server-slave.sh:/usr/bin/redis-server.sh
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s

    redis-slave02:
        image: redis:8
        container_name: redis-slave02
        command: sh /usr/bin/redis-server.sh
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        networks:
            - pigeon-net
        volumes:
            - ./redis/server-slave.sh:/usr/bin/redis-server.sh
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s

    redis-lock01:
        image: redis:8
        container_name: redis-lock01
        command: sh /usr/bin/redis-server.sh
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        networks:
            - pigeon-net
        volumes:
            - ./redis/server-lock.sh:/usr/bin/redis-server.sh
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s

    redis-lock02:
        image: redis:8
        container_name: redis-lock02
        command: sh /usr/bin/redis-server.sh
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        networks:
            - pigeon-net
        volumes:
            - ./redis/server-lock.sh:/usr/bin/redis-server.sh
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s

    redis-lock03:
